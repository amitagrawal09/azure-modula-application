<svg viewBox="0 0 1400 760" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#444"/>
    </marker>
    <style>
      .box { rx:10; stroke-width:1.5; }
      .title { font-size:15px; font-weight:600; fill:#1a1a1a; }
      .sub { font-size:11.5px; fill:#444; }
      .lane { font-size:13px; font-weight:700; fill:#666; letter-spacing:1px; }
      .flow { stroke:#444; stroke-width:1.8; fill:none; marker-end:url(#arrow); }
      .flowlabel { font-size:11px; fill:#333; font-style:italic; }
    </style>
  </defs>

  <text x="700" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#111">Modula ↔ D365 ↔ Databricks DataHub — Event-Driven Integration Architecture</text>

  <!-- Lanes -->
  <rect x="20" y="60" width="330" height="640" fill="#eef4fb" stroke="#b8cfe8" rx="12"/>
  <text x="185" y="85" text-anchor="middle" class="lane">SOURCE — WAREHOUSE (VLM)</text>

  <rect x="370" y="60" width="640" height="640" fill="#f2f9f0" stroke="#bfe0b8" rx="12"/>
  <text x="690" y="85" text-anchor="middle" class="lane">AZURE INTEGRATION LAYER (Landing Zone)</text>

  <rect x="1030" y="60" width="350" height="640" fill="#fdf4ec" stroke="#eccfae" rx="12"/>
  <text x="1205" y="85" text-anchor="middle" class="lane">TARGET SYSTEMS</text>

  <!-- Modula -->
  <rect x="55" y="130" width="260" height="110" fill="#fff" stroke="#2b6cb0" class="box"/>
  <text x="185" y="160" text-anchor="middle" class="title">Modula WMS / VLM</text>
  <text x="185" y="182" text-anchor="middle" class="sub">Inventory movements, put-away,</text>
  <text x="185" y="198" text-anchor="middle" class="sub">picks, adjustments, cycle counts</text>
  <text x="185" y="220" text-anchor="middle" class="sub">Pushes via REST webhook / polled API</text>

  <!-- Modula Adapter -->
  <rect x="410" y="120" width="260" height="130" fill="#fff" stroke="#38a169" class="box"/>
  <text x="540" y="148" text-anchor="middle" class="title">Modula Inbound Adapter</text>
  <text x="540" y="168" text-anchor="middle" class="sub">Azure Container App (API)</text>
  <text x="540" y="186" text-anchor="middle" class="sub">POST /inventory/events</text>
  <text x="540" y="204" text-anchor="middle" class="sub">Validates → wraps in CDM envelope</text>
  <text x="540" y="222" text-anchor="middle" class="sub">(controlMessage + payload) → publishes</text>
  <text x="540" y="240" text-anchor="middle" class="sub">to Event Hub with idempotency key</text>

  <!-- APIM -->
  <rect x="410" y="290" width="260" height="70" fill="#fff" stroke="#805ad5" class="box"/>
  <text x="540" y="318" text-anchor="middle" class="title">API Management</text>
  <text x="540" y="340" text-anchor="middle" class="sub">Facade, OAuth2 (Entra ID), throttling</text>

  <!-- Event Hub -->
  <rect x="410" y="400" width="260" height="120" fill="#fffbea" stroke="#d69e2e" class="box"/>
  <text x="540" y="430" text-anchor="middle" class="title">Azure Event Hubs</text>
  <text x="540" y="452" text-anchor="middle" class="sub">Namespace: evhns-modula-int</text>
  <text x="540" y="470" text-anchor="middle" class="sub">Hub: inventory-events (8 partitions)</text>
  <text x="540" y="488" text-anchor="middle" class="sub">Consumer groups: cg-d365, cg-datahub</text>
  <text x="540" y="506" text-anchor="middle" class="sub">Capture → ADLS Gen2 (raw archive)</text>

  <!-- D365 Adapter -->
  <rect x="740" y="150" width="240" height="130" fill="#fff" stroke="#38a169" class="box"/>
  <text x="860" y="178" text-anchor="middle" class="title">D365 Outbound Adapter</text>
  <text x="860" y="198" text-anchor="middle" class="sub">Azure Container App (consumer)</text>
  <text x="860" y="216" text-anchor="middle" class="sub">Reads cg-d365 → maps CDM →</text>
  <text x="860" y="234" text-anchor="middle" class="sub">D365 F&amp;O OData / Inventory</text>
  <text x="860" y="252" text-anchor="middle" class="sub">Visibility API; retry + DLQ via</text>
  <text x="860" y="270" text-anchor="middle" class="sub">Service Bus dead-letter queue</text>

  <!-- DataHub Adapter -->
  <rect x="740" y="420" width="240" height="130" fill="#fff" stroke="#38a169" class="box"/>
  <text x="860" y="448" text-anchor="middle" class="title">DataHub Outbound Adapter</text>
  <text x="860" y="468" text-anchor="middle" class="sub">Azure Container App (consumer)</text>
  <text x="860" y="486" text-anchor="middle" class="sub">Reads cg-datahub → lands JSON to</text>
  <text x="860" y="504" text-anchor="middle" class="sub">ADLS Gen2 bronze zone / posts to</text>
  <text x="860" y="522" text-anchor="middle" class="sub">Databricks Ingest API (DLT ready)</text>
  <text x="860" y="540" text-anchor="middle" class="sub">Exactly-once via checkpoint store</text>

  <!-- D365 -->
  <rect x="1065" y="150" width="280" height="100" fill="#fff" stroke="#c05621" class="box"/>
  <text x="1205" y="180" text-anchor="middle" class="title">Dynamics 365 F&amp;O</text>
  <text x="1205" y="202" text-anchor="middle" class="sub">Inventory journals, on-hand updates</text>
  <text x="1205" y="220" text-anchor="middle" class="sub">OData / Inventory Visibility Add-in</text>

  <!-- Databricks -->
  <rect x="1065" y="420" width="280" height="120" fill="#fff" stroke="#c05621" class="box"/>
  <text x="1205" y="450" text-anchor="middle" class="title">Databricks DataHub</text>
  <text x="1205" y="472" text-anchor="middle" class="sub">Bronze → Silver → Gold (DLT)</text>
  <text x="1205" y="490" text-anchor="middle" class="sub">Unity Catalog · inventory_events tbl</text>
  <text x="1205" y="508" text-anchor="middle" class="sub">Analytics / Power BI semantic layer</text>

  <!-- Cross-cutting -->
  <rect x="410" y="560" width="570" height="120" fill="#f7f7f7" stroke="#a0aec0" class="box"/>
  <text x="695" y="588" text-anchor="middle" class="title">Cross-Cutting Services</text>
  <text x="695" y="612" text-anchor="middle" class="sub">Key Vault (secrets/creds) · Managed Identity (all hops) · App Insights + Log Analytics (E2E correlation via controlMessage.correlationId)</text>
  <text x="695" y="632" text-anchor="middle" class="sub">Service Bus DLQ (poison messages) · Azure Monitor alerts · Container Registry · VNet + Private Endpoints (Event Hubs, KV, ADLS)</text>
  <text x="695" y="652" text-anchor="middle" class="sub">Schema Registry (Event Hubs) enforcing CDM envelope version</text>

  <!-- Flows -->
  <path class="flow" d="M315,185 L405,185"/>
  <text x="322" y="176" class="flowlabel">1. webhook</text>
  <path class="flow" d="M540,250 L540,285"/>
  <path class="flow" d="M540,360 L540,395"/>
  <text x="548" y="382" class="flowlabel">2. publish CDM event</text>
  <path class="flow" d="M670,435 C700,420 710,300 735,240"/>
  <text x="660" y="330" class="flowlabel">3a. cg-d365</text>
  <path class="flow" d="M670,470 L735,477"/>
  <text x="678" y="462" class="flowlabel">3b. cg-datahub</text>
  <path class="flow" d="M980,205 L1060,200"/>
  <text x="990" y="192" class="flowlabel">4a. OData upsert</text>
  <path class="flow" d="M980,480 L1060,478"/>
  <text x="990" y="468" class="flowlabel">4b. bronze ingest</text>
</svg>
